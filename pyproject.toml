[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "educloud-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django==6.1.*",
    "djangorestframework>=3.16",
    "psycopg[binary]>=3.2",
    "celery>=5.5",
    "redis>=5.0",
    "django-redis>=5.4",
    "boto3>=1.34",
    "argon2-cffi>=23",
    "drf-spectacular>=0.27",
    "django-filter>=24",
    "django-cors-headers>=4.4",
    "structlog>=24",
    "python-magic>=0.4.27",
    "python-dateutil>=2.9",
    "nh3>=0.2",
    "gunicorn>=22",
    "whitenoise>=6",
]

[project.optional-dependencies]
clamav = ["clamd"]
sentry = ["sentry-sdk"]
dev = [
    "factory-boy>=3.3",
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-reuse-db",
    "coverage[toml]>=7.0",
    "freezegun>=1.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "C4", "DTZ", "T20", "RET", "SIM", "TCH"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = false

[[tool.mypy.overrides]]
module = ["core.*", "*.services.*"]
strict = true
disallow_untyped_defs = true

[tool.django-stubs]
django_settings_module = "config.settings.base"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = "-x --reuse-db"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*", "*/factories/*"]

[tool.coverage.report]
fail_under = 80
